---
title: Thanh Le - Technical Blog
description: "Linux, Embedded Systems, Networking, and DevOps Engineering"
author: Thanh Le (Lê Quang Thành)
email: thanhlev@amazon.com.vn
# No trailing slash: layouts and jekyll-sitemap append page.url (which starts with "/"),
# a trailing slash here gave "https://thanhlev.github.io//embedded/..." (fixed 2026-11-22).
url: https://thanhlev.github.io
baseurl: ""
show_downloads: false
google_analytics: UA-121634256-1
theme: jekyll-theme-slate

# SEO and Social
twitter_username: 
github_username: thanhlev
linkedin_username: thanhlev

# Repo files that must not be published (2026-11-22 audit: CLAUDE.md, README.md and LICENSE
# were copied into _site and served). Setting `exclude` replaces Jekyll's default list, so the
# defaults (Gemfile*, node_modules, vendor/...) are repeated here. run.sh is listed for when it
# comes back; it is not in the repo today.
exclude:
  - CLAUDE.md
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - run.sh
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Build settings
markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap

collections_dir: pages
collections:
  linux_general:
    output: true
    permalink: /:collection/:name
  linux_networking:
    output: true
    permalink: /:collection/:name
  embedded:
    output: true
    permalink: /:collection/:name
  yocto:
    output: true
    permalink: /:collection/:name
  personal:
    output: true
    permalink: /:collection/:name
  # 2026-11-22: robot projects, same hub + STAR sub-page convention as the board pages
  robotics:
    output: true
    permalink: /:collection/:name

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "linux_general"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "linux_networking"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "embedded"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "yocto"
    values:
      layout: "default"
