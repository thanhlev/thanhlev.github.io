<!-- Additional custom head elements -->

<!-- 2026-11-27: the font preconnects moved to _layouts/default.html next to the font stylesheet (+ gstatic,
     crossorigin); the cdnjs one went with Font Awesome. wiki: http://localhost:3000/wiki/claude/blog_agent#l11 -->

<!-- Additional Meta Tags -->
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#f6f4ee">  <!-- paper colour of the 2026-11-22 Datasheet design -->

<!-- Apple Touch Icons: PNGs resized from /favicon.ico (256 px) with Pillow, 2026-11-22;
     before that the three files did not exist and each page logged 3 x 404. -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32x32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/favicon-16x16.png' | relative_url }}">

<!-- Structured Data -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "{{ site.author }}",
  "url": "{{ site.url }}",
  "sameAs": [
    "https://github.com/{{ site.github_username }}",
    "https://www.linkedin.com/in/{{ site.linkedin_username }}"
  ],
  "jobTitle": "Software Engineer",
  "worksFor": {
    "@type": "Organization",
    "name": "Amazon"
  }
}
</script>

<!-- 2026-11-27: Atom feed again, now a hand-written /feed.xml (Liquid, safe mode; the 2026-11-22 tag pointed at a
     jekyll-feed file that was never built). wiki: http://localhost:3000/wiki/claude/blog_agent#l11 -->
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
